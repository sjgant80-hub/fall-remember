name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test
      # ⚑ Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break the memory organ, then READ the verdict (must be CLEAN)
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate fall-remember.mjs             --timeout 60000 --cap 500 --baseline witness.baseline.json             --test node --test all.test.mjs | tee verdict.txt
          grep -q '"clean": true' verdict.txt || { echo "::error::mutants survived — the gate is not clean"; exit 1; }
      - name: witness — the senses (the ear and the voice) re-prove themselves too
        run: |
          node /tmp/witness/witness.mjs mutate senses.mjs             --timeout 60000 --cap 400 --baseline senses.baseline.json             --test node --test senses.test.mjs | tee senses-verdict.txt
          grep -q '"clean": true' senses-verdict.txt || { echo "::error::mutants survived in the senses — the gate is not clean"; exit 1; }
      # store.mjs is the durable "own your memory file" envelope law (self-verifying receipt over a
      # compressed snapshot). disk.mjs is the UNGATED I/O wire (gzip via CompressionStream + File
      # System Access + download fallback) — its browser-only branches can't be mutation-tested in
      # node, so it is covered by the `node --test` step above + the live save→wipe→restore walk, not witness.
      - name: witness — the durable store (own-your-memory envelope) re-proves itself too
        run: |
          node /tmp/witness/witness.mjs mutate store.mjs             --timeout 60000 --cap 500             --test node --test store.test.mjs | tee store-verdict.txt
          grep -q '"clean": true' store-verdict.txt || { echo "::error::mutants survived in the store — the gate is not clean"; exit 1; }
